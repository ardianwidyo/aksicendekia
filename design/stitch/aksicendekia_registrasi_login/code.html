            border-bottom-width: 4px;
            border-color: theme('colors.secondary-container');
            background-color: theme('colors.surface-variant');
        }
        .input-floating:focus-within label, .input-floating input:not(:placeholder-shown) + label {
            transform: translateY(-120%) scale(0.85);
            color: theme('colors.primary');
        }
    </style>

<body class="bg-background text-on-surface h-screen w-full flex overflow-hidden antialiased">
<!-- Left Side: Playful Illustration (Hidden on small screens) -->
<div class="hidden lg:flex w-1/2 bg-surface-container relative items-center justify-center p-xl overflow-hidden">
<!-- Decorative abstract blobs -->
<div class="absolute top-10 left-10 w-32 h-32 bg-secondary-container/20 rounded-full blur-2xl"></div>
<div class="absolute bottom-20 right-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
<div class="relative z-10 w-full max-w-[500px] h-full flex flex-col justify-center items-center text-center">
<img alt="AksiCendekia Logo" class="w-48 h-48 object-contain mb-8 rounded-xl shadow-lg border border-outline-variant/30" src="https://lh3.googleusercontent.com/aida/AEtjO1Xb7cng8awxAwUblZx8L_PfySKfcCQetGyNMTBMyKxPJ9w8SSIJ-ogujf13Zl_E6DxQ-dOzNTpJL9_Q2SVyVT6zrMwwg78uwLhO2t0wa0VfR550apFnF6yw22bHk1T9FDL28kHt4yWtCoyJEfuQUv1XdKhEah3F-roMWDYj5TeR4g-HriILB_YGqOBObscas_1_4PLuUn7X1sUxzxV_nHF2Szp5o9WoN_-ib54ek0UO-nVXnzoU5eqGN0wp"/>
<h2 class="font-display-lg text-display-lg text-primary mb-md">Belajar Lebih Seru</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">Jelajahi dunia pengetahuan dengan cara yang menyenangkan dan interaktif bersama teman dan gurumu.</p>
<!-- Floating Elements -->
<div class="mt-12 relative w-full h-64">
<div class="w-full h-full bg-contain bg-center bg-no-repeat absolute inset-0 animate-[bounce_4s_ease-in-out_infinite]" data-alt="A vibrant, playful 3D geometric illustration of a school bus, floating books, and a smiling sun in a modern, light-mode educational setting. The colors are predominantly azure blue and amber, with soft ambient lighting and squishy, tactile textures. The composition is dynamic and cheerful, evoking a sense of adventure in learning." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCzpzi-rGHHRwzb-iHX-oH-TUaooEdZwPPDITbjiz_syXQUdypwSPkqNTsIJX9QSIByex1pVJoOR2Eu2UzNPRPE9oebEYQfJe64sUI34bvxgEbLFrBFg--kRNR6nwS4hOt36CoTSBkZZqGSe1uaOzSeIzQ-aOe9ZWEUYe11hSqGn5UmWnZ7Trp5XGl9W1VYZw0pplaEujU15Y1K8Qb9aL969WlTroFSyMynDRPdWsRHo4asLd3p5cGoVQ')"></div>
</div>
</div>
</div>
<!-- Right Side: Login / Register Form -->
<div class="w-full lg:w-1/2 bg-surface h-full flex flex-col justify-center px-md sm:px-xl py-lg overflow-y-auto">
<div class="w-full max-w-[480px] mx-auto">
<!-- Mobile Logo -->
<div class="lg:hidden flex justify-center mb-8">
<img alt="AksiCendekia Logo" class="w-24 h-24 object-contain rounded-lg shadow-sm border border-outline-variant/20" src="https://lh3.googleusercontent.com/aida/AEtjO1Xb7cng8awxAwUblZx8L_PfySKfcCQetGyNMTBMyKxPJ9w8SSIJ-ogujf13Zl_E6DxQ-dOzNTpJL9_Q2SVyVT6zrMwwg78uwLhO2t0wa0VfR550apFnF6yw22bHk1T9FDL28kHt4yWtCoyJEfuQUv1XdKhEah3F-roMWDYj5TeR4g-HriILB_YGqOBObscas_1_4PLuUn7X1sUxzxV_nHF2Szp5o9WoN_-ib54ek0UO-nVXnzoU5eqGN0wp"/>
</div>
<!-- Header -->
<div class="mb-xl text-center lg:text-left">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Selamat Datang di AksiCendekia</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Pilih peranmu untuk memulai petualangan</p>
</div>
<!-- Role Selector -->
<div class="grid grid-cols-2 gap-sm mb-xl">
<button class="role-btn active flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-all h-24" data-role="student" type="button">
<span class="material-symbols-outlined text-primary text-3xl mb-1">school</span>
<span class="font-label-sm text-label-sm text-on-surface">Student</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-all h-24" data-role="parent" type="button">
<span class="material-symbols-outlined text-secondary-container text-3xl mb-1">family_restroom</span>
<span class="font-label-sm text-label-sm text-on-surface">Parent</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-all h-24" data-role="teacher" type="button">
<span class="material-symbols-outlined text-tertiary text-3xl mb-1">cast_for_education</span>
<span class="font-label-sm text-label-sm text-on-surface">Teacher</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-sm border border-outline-variant rounded-xl bg-surface hover:bg-surface-container-low transition-all h-24" data-role="admin" type="button">
<span class="material-symbols-outlined text-on-surface-variant text-3xl mb-1">admin_panel_settings</span>
<span class="font-label-sm text-label-sm text-on-surface">School Admin</span>
</button>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Email Input -->
<div class="relative input-floating h-14">
<input class="peer w-full h-full bg-surface-container-lowest border border-outline rounded-lg px-4 pt-4 pb-1 text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent" id="email" name="email" placeholder="Email Address" required="" type="email"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md text-body-md transition-all pointer-events-none origin-left" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="relative input-floating h-14">
<input class="peer w-full h-full bg-surface-container-lowest border border-outline rounded-lg px-4 pt-4 pb-1 text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-transparent" id="password" name="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md text-body-md transition-all pointer-events-none origin-left" for="password">Password</label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline text-primary focus:ring-primary/50 transition-all cursor-pointer" type="checkbox"/>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors text-sm">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary text-on-primary font-title-md text-title-md rounded-xl hover:bg-surface-tint active:translate-y-[2px] active:border-b-0 border-b-4 border-on-primary-fixed-variant shadow-sm transition-all flex items-center justify-center gap-2 mt-lg" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Sign Up Link -->
<p class="text-center mt-xl font-body-md text-body-md text-on-surface-variant">
                Belum punya akun? <a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Daftar sekarang</a>
</p>
</div>
</div>
<script>
        // Simple role selection interaction
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body></html>
