<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden relative">

<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(circle at 2px 2px, currentColor 1px, transparent 0); background-size: 32px 32px;"></div>
<!-- No global nav as this is an active transactional/focused screen (Quiz) -->
<main class="flex-grow flex flex-col items-center justify-start pt-lg px-md w-full max-w-container-max mx-auto relative z-10 h-screen overflow-y-auto pb-xl">
<!-- Header: Progress & Timer -->
<header class="w-full flex justify-between items-center mb-lg">
<div class="flex items-center gap-sm text-on-surface-variant cursor-pointer hover:text-primary transition-colors">
<span class="material-symbols-outlined font-label-sm">close</span>
<span class="font-label-sm text-label-sm">Exit Quiz</span>
</div>
<div class="flex-grow max-w-md mx-md">
<div class="flex justify-between items-end mb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Question 4 of 10</span>
<span class="font-label-sm text-label-sm font-bold text-primary">Score: 450</span>
</div>
<div class="w-full bg-primary-fixed-dim/30 h-3 rounded-full overflow-hidden relative shadow-inner">
<div class="absolute top-0 left-0 h-full bg-gradient-to-r from-primary to-tertiary w-2/5 rounded-full shadow-sm"></div>
</div>
</div>
<div class="flex items-center gap-xs bg-surface-container-high px-sm py-xs rounded-full border border-surface-dim shadow-sm">
<span class="material-symbols-outlined text-secondary-container animate-pulse">timer</span>
<span class="font-title-md text-title-md text-on-surface tabular-nums">02:14</span>
</div>
</header>
<!-- Question Canvas -->
<div class="w-full max-w-3xl flex flex-col items-center flex-grow">
<div class="bg-surface-container-lowest rounded-xl shadow-md border border-surface-variant p-lg w-full text-center relative mb-xl overflow-visible">
<!-- Mascot / Hint Bubble -->
<div class="absolute -top-6 -right-6 flex flex-col items-end z-20 group">
<div class="bg-secondary-fixed text-on-secondary-fixed-variant p-sm rounded-xl rounded-br-none shadow-md border-2 border-secondary-fixed-dim text-label-sm font-label-sm mb-xs opacity-0 group-hover:opacity-100 transition-opacity transform translate-y-2 group-hover:translate-y-0 duration-200 w-48 text-left">
                        Remember the formula for the area of a triangle: 1/2 * base * height!
                    </div>
<div class="w-16 h-16 bg-surface-container rounded-full border-4 border-secondary-fixed-dim shadow-sm overflow-hidden flex items-center justify-center cursor-help">
<img class="w-full h-full object-cover" data-alt="A cute, simple 3D geometric mascot character looking helpful, rendered in bright, soft lighting against a white background, modern educational aesthetic, very friendly." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBu3ZYMAtNdwJxe3ZI8Q4NFQ3D8MkmDPbv2xYRkDyNQoiiKVd8mpi2NTUUY6-nZQSm-lkB4-Re4AaSGsqQ8aDtCjAmyWE1kfi6NnbS9bcZOU6-v68eE2QSFwwt_aB8-3IdDeMGonhBJqwxyBJp2n28qYoDL-kyxrNgIdkAsAU8XUwzt0bscvEjNKi3I4VBlPcn8IKHVeieTAT0voaWME1I0WZMuoMJzYNCRRCSccb3Uxvl0sq8JtrGOUw"/>
</div>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-sm">What is the area of a right triangle with a base of 6cm and a height of 8cm?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select the correct answer below.</p>
<!-- Visual Aid -->
<div class="mt-md flex justify-center w-full h-48 rounded-lg overflow-hidden border border-outline-variant/30 bg-surface">
<img class="h-full object-contain mix-blend-multiply" data-alt="A clean, minimalist mathematical diagram showing a right triangle with a base labeled 6cm and a height labeled 8cm. The style is modern, using flat colors from a bright educational palette, with clear typography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8e7Fl8ZDc7Z2mrdXwBuWRiDaY-gEUk0sTP6KbqViqrcwppQ5nlzqmUCmEFhvwsD8VWovkClDF86iVdsMs_oXsN1yREmW35jKw2d0Avo5LMZc6IVwcnBR2kfA2xVkcJy0dsKZZWiOSIaKnSnkiz1v6k_l8vmrTm0FG1hmZRCiVcEdrp6a31CZ0m6FSCzPYAlrAHETTkqSMMyAx7qMscc4Lo_g6MyDdY48RGho1hNUkWg6HfPgXSpQRhA"/>
</div>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md w-full">
<!-- Option A -->
<button class="option-card bg-surface-container-lowest rounded-xl p-md border border-surface-variant border-b-4 border-b-outline-variant shadow-sm flex items-center gap-md text-left transition-all duration-150 relative overflow-hidden group">

</button>

<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-title-md text-title-md text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">B</div>
<span class="font-title-md text-title-md text-on-surface">24 cm²</span>
</button>
<!-- Option C -->
<button class="option-card bg-surface-container-lowest rounded-xl p-md border border-surface-variant border-b-4 border-b-outline-variant shadow-sm flex items-center gap-md text-left transition-all duration-150 relative overflow-hidden group">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-title-md text-title-md text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">C</div>
<span class="font-title-md text-title-md text-on-surface">48 cm²</span>
</button>
<!-- Option D -->

<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-title-md text-title-md text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">D</div>

</button>
</div>

<button class="px-md py-sm rounded-lg border-2 border-outline text-outline font-label-sm text-label-sm uppercase tracking-wider flex items-center gap-xs">
<span class="material-symbols-outlined">arrow_back</span> Previous
                </button>
<button class="px-md py-sm rounded-lg bg-outline text-surface-container-lowest font-label-sm text-label-sm uppercase tracking-wider flex items-center gap-xs border-b-4 border-outline-variant">
                    Next <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        // Simple interaction script to demonstrate state change on click
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                // Remove selected state from all
                document.querySelectorAll('.option-card').forEach(c => {
                    c.classList.remove('bg-primary-container', 'border-primary', 'border-b-primary-fixed-variant');
                    c.classList.add('bg-surface-container-lowest', 'border-surface-variant', 'border-b-outline-variant');
                    c.querySelector('div').classList.remove('bg-primary', 'text-on-primary');
                    c.querySelector('div').classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                
                // Add selected state to clicked
                this.classList.remove('bg-surface-container-lowest', 'border-surface-variant', 'border-b-outline-variant');
                this.classList.add('bg-primary-container', 'border-primary', 'border-b-primary-fixed-variant');
                this.querySelector('div').classList.remove('bg-surface-container', 'text-on-surface-variant', 'group-hover:bg-primary-container', 'group-hover:text-on-primary-container');
                this.querySelector('div').classList.add('bg-primary', 'text-on-primary');

                // Enable Next button (simulated)
                const nextBtn = document.querySelector('.mt-lg.opacity-50');
                if(nextBtn) {
                    nextBtn.classList.remove('opacity-50', 'pointer-events-none');
                    const btn = nextBtn.querySelector('button:last-child');
                    btn.classList.remove('bg-outline', 'border-outline-variant');
                    btn.classList.add('bg-primary', 'border-on-primary-fixed-variant');
                }
            });
        });
    </script>
</body></html>
