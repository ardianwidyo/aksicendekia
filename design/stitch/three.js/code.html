<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_114 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_114" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_114');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Floating Geometric Objects
const geometries = [
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.SphereGeometry(0.7, 32, 32),
    new THREE.ConeGeometry(0.7, 1.2, 32)
];

const material = new THREE.MeshPhongMaterial({ 
    color: 0x3B82F6, 
    shininess: 100,
    transparent: true,
    opacity: 0.8
});

const meshes = [];
for (let i = 0; i < 5; i++) {
    const mesh = new THREE.Mesh(geometries[Math.floor(Math.random() * geometries.length)], material);
    mesh.position.set(Math.random() * 10 - 5, Math.random() * 10 - 5, Math.random() * -10);
    scene.add(mesh);
    meshes.push({
        mesh,
        rotSpeed: Math.random() * 0.02,
        floatSpeed: Math.random() * 0.01
    });
}

const light = new THREE.DirectionalLight(0xffxff, 1);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    meshes.forEach(m => {
        m.mesh.rotation.x += m.rotSpeed;
        m.mesh.rotation.y += m.rotSpeed;
        m.mesh.position.y += Math.sin(Date.now() * m.floatSpeed) * 0.01;
    });
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_114 -->
</body>
</html>
