<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Garis bilangan menunjukkan lompatan lima langkah dari angka 12 ke angka 17">
  <rect width="320" height="200" rx="16" fill="#eef3fc"/>

  <text x="160" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0058be">12 + 5 = 17</text>

  <!-- jump arc from 12 (x=186) to 17 (x=251) -->
  <path d="M 186 130 Q 218 68 251 130" fill="none" stroke="#00855b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="251,130 242,126 246,136" fill="#00855b"/>
  <rect x="196" y="82" width="44" height="22" rx="6" fill="#ffffff" stroke="#00855b" stroke-width="1.5"/>
  <text x="218" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#00855b">+5</text>

  <!-- number line: 0 at x=30, 20 at x=290 (13px per unit) -->
  <line x1="30" y1="130" x2="290" y2="130" stroke="#41474e" stroke-width="2"/>
  <polygon points="290,130 282,125 282,135" fill="#41474e"/>

  <g font-family="system-ui,sans-serif" font-size="11" fill="#41474e">
    <line x1="30" y1="124" x2="30" y2="136" stroke="#41474e" stroke-width="2"/>
    <text x="30" y="152" text-anchor="middle">0</text>

    <line x1="95" y1="124" x2="95" y2="136" stroke="#41474e" stroke-width="2"/>
    <text x="95" y="152" text-anchor="middle">5</text>

    <line x1="160" y1="124" x2="160" y2="136" stroke="#41474e" stroke-width="2"/>
    <text x="160" y="152" text-anchor="middle">10</text>

    <line x1="225" y1="124" x2="225" y2="136" stroke="#41474e" stroke-width="2"/>
    <text x="225" y="152" text-anchor="middle">15</text>

    <line x1="290" y1="118" x2="290" y2="136" stroke="#41474e" stroke-width="2"/>
    <text x="290" y="152" text-anchor="middle">20</text>
  </g>

  <!-- start point 12 -->
  <circle cx="186" cy="130" r="7" fill="#2170e4" stroke="#0058be" stroke-width="2"/>
  <text x="186" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0058be">12</text>

  <!-- end point 17 -->
  <circle cx="251" cy="130" r="7" fill="#00855b" stroke="#00512b" stroke-width="2"/>
  <text x="251" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#00512b">17</text>
</svg>
